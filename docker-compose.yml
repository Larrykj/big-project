version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. THE BRAIN: Core ERP Service (Java / Spring Boot)
  # Handles: User Auth, Orders, Inventory, Main Logic
  # -------------------------------------------------------------
  core-service:
    container_name: omni_core
    build: ./core-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql_db:3306/omnidb
      - SPRING_DATA_MONGODB_URI=mongodb://mongo_db:27017/omnillogs
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    depends_on:
      - mysql_db
      - mongo_db
    networks:
      - omni_network

  # -------------------------------------------------------------
  # 2. THE FINANCE: Billing & Payouts (C# / .NET)
  # Handles: Invoices, Driver Payouts, Tax Calcs
  # -------------------------------------------------------------
  finance-service:
    container_name: omni_finance
    build: ./finance-service
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql_db;Database=omnifinance;User=root;Password=${DB_PASSWORD:-9486};
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET}
      - MPESA_SHORTCODE=${MPESA_SHORTCODE}
      - MPESA_PASSKEY=${MPESA_PASSKEY}
      - MPESA_ENV=${MPESA_ENV}
    depends_on:
      - mysql_db
    networks:
      - omni_network

  # -------------------------------------------------------------
  # 3. THE SPEED: Realtime Tracking (Node.js)
  # Handles: WebSockets, Live Map Updates, Notifications
  # -------------------------------------------------------------
  realtime-service:
    container_name: omni_realtime
    build: ./realtime-service
    ports:
      - "3000:3000"
    environment:
      - REDIS_HOST=redis
      - MONGO_URL=mongodb://mongo_db:27017/omnillogs
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - redis
      - mongo_db
    networks:
      - omni_network

  # -------------------------------------------------------------
  # 4. THE INTELLIGENCE: AI & Optimization (Python)
  # Handles: Route Prediction, ETA, Weather Analysis
  # -------------------------------------------------------------
  ai-service:
    container_name: omni_ai
    build: ./ai-service
    ports:
      - "5001:5001"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - omni_network

  # -------------------------------------------------------------
  # 5. THE PORTAL: Vendor Dashboard (Ruby on Rails)
  # Handles: Trucking Company Registration, Document Upload
  # -------------------------------------------------------------
  vendor-portal:
    container_name: omni_vendor
    build: ./vendor-portal
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=mysql2://root:${DB_PASSWORD:-9486}@mysql_db:3306/omnivendor
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    depends_on:
      - mysql_db
    networks:
      - omni_network

  # -------------------------------------------------------------
  # 6. THE HARDWARE: IoT Bridge (C++)
  # Handles: Raw TCP/MQTT streams from truck sensors
  # -------------------------------------------------------------
  hardware-bridge:
    container_name: omni_hardware
    build: ./hardware-bridge
    ports:
      - "1883:1883" # MQTT
    networks:
      - omni_network

  # =============================================================
  # INFRASTRUCTURE (Databases & Message Brokers)
  # =============================================================

  # Relational Data (Users, Orders, Finance)
  mysql_db:
    image: mysql:8.0
    container_name: omni_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-9486}
      MYSQL_DATABASE: omnidb
    ports:
      - "3307:3306" # Mapped to 3307 to avoid conflict with local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - omni_network

  # Unstructured Data (Logs, Chat, Sensor History)
  mongo_db:
    image: mongo:latest
    container_name: omni_mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - omni_network

  # Message Broker (Fast communication between services)
  redis:
    image: redis:alpine
    container_name: omni_redis
    ports:
      - "6380:6379"
    networks:
      - omni_network

networks:
  omni_network:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
